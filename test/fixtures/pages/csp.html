<!doctype html>
<html lang="ko">
<head><meta charset="utf-8">
<!-- unsafe-eval · unsafe-inline 이 없는 엄격한 CSP: 페이지 안에서 문자열을 eval 하면 막힌다. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'self'">
<title>CSP 시험 페이지</title></head>
<body>
  <h1>CSP 시험 페이지</h1>
  <button id="b" type="button">단추</button>
</body>
</html>
