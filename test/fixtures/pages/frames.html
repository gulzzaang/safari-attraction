<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>프레임 시험 페이지</title></head>
<body>
  <h1>프레임 시험 페이지</h1>
  <!-- 같은 출처 -->
  <iframe id="same" src="frame-inner.html" width="400" height="120" title="같은 출처 프레임"></iframe>
  <!-- 다른 출처: 같은 서버를 localhost 로 부른다(이 페이지는 127.0.0.1 로 열린다). -->
  <iframe id="cross" width="400" height="120"></iframe>
  <script>
    document.getElementById('cross').src = location.origin.replace('//127.0.0.1', '//localhost') + '/frame-inner.html';
  </script>
</body>
</html>
