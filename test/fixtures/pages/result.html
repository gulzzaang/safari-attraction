<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>결과 페이지</title></head>
<body>
  <h1>결과 페이지</h1>
  <p id="q"></p>
  <script>
    var q = new URLSearchParams(location.search).get('q') || '';
    document.getElementById('q').textContent = q;
    document.title = '결과: ' + q;
  </script>
</body>
</html>
