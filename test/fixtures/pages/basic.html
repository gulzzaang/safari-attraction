<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>기본 시험 페이지</title></head>
<body>
  <h1>기본 시험 페이지</h1>
  <p>안녕하세요. 읽기 시험용 문단입니다.</p>
  <a href="#next">다음으로</a>
  <button id="save" type="button">저장</button>
  <label for="name">이름</label>
  <input id="name" type="text" placeholder="이름을 입력">
  <input id="pw" type="password" aria-label="비밀번호" value="비밀값">
  <ul><li>첫째 항목</li><li>둘째 항목</li></ul>
  <div style="display:none"><button id="ghost">숨은 단추</button></div>
  <div aria-hidden="true"><button id="aria-ghost">가려진 단추</button></div>
</body>
</html>
